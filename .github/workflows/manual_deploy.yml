# Function: This automation file will run when 
# a push is made to main

name: Deploy to DigitalOcean
on:
  push:
    branches: ['main']
  workflow_dispatch: # allows manual deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy Main to DigitalOcean
      id: auto_deploy
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} '
          cd /home/django/dev3_cust2
          git pull origin main
        '

    # Runs if the step above fails
    - name: Push Local Changes from DigitalOcean
      if: steps.auto_deploy.outcome == 'failure'
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} '
          cd /home/django/dev3_cust2
          
          git checkout -b prod-local-overrides   # create branch with current state
          git add .                              # stage the local changes
          git commit -m "prod server overrides"  # commit them to the branch
          git push origin prod-local-overrides   # back it up remotely
          
          git checkout main && git pull          # update main
        '
        
    
    - name: Start Server
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} '
          cd /home/django/dev3_cust2/hiddengems
          pip install -r requirements.txt
          python3 manage.py migrate
          python3 manage.py collectstatic --noinput
          sudo systemctl restart gunicorn 
        '
